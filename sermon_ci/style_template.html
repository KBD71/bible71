<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>설교 요약: 하나님의 법에 귀를 기울이라 (이사야 1:1-20)</title>
    <!-- Open Graph 메타 태그 -->
    <meta property="og:type" content="article">
    <meta property="og:title" content="설교 요약: 하나님의 법에 귀를 기울이라 (이사야 1:1-20)">
    <meta property="og:description" content="김대근 목사님의 설교 요약입니다. 언약을 깨뜨린 자식과 같은 우리를 향해 돌이켜 변론하자고 부르시는 하나님의 아픈 사랑과 용서의 약속을 담고 있습니다.">
    <meta property="og:image" content="https://drive.google.com/uc?export=view&id=1HWEyIUmIRa4TEXBUDMpDi--PC8DtitXJ">
    <meta property="og:url" content="">
    <!-- Google Fonts 및 Tailwind CSS -->
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: 'Noto Sans KR', sans-serif; background-color: #f3f4f6; }
        .keyword { box-shadow: inset 0 -0.5em 0 0 rgba(255, 255, 0, 0.3); font-weight: 700; }
        .scripture-text-section p { margin-bottom: 0.5rem; line-height: 1.6; }
        .card { transition: transform 0.2s; }
        .card:hover { transform: translateY(-2px); }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 leading-relaxed min-h-screen">
    <div class="max-w-3xl mx-auto px-4 py-8">
        <!-- 1단계: 가시적 헤더(Body Header) 구성 -->
        <header class="bg-slate-900 text-white rounded-2xl p-6 md:p-8 mb-6 shadow-xl relative overflow-hidden">
            <div class="absolute inset-0 bg-gradient-to-r from-blue-900 to-indigo-900 opacity-50"></div>
            <div class="relative z-10">
                <div class="flex items-center space-x-2 text-indigo-300 text-sm font-semibold tracking-wider uppercase mb-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                    </svg>
                    <span>{{시리즈명 예: 이사야 강해}}</span>
                </div>
                <h1 class="text-2xl md:text-3xl font-bold tracking-tight mb-3">{{설교 제목}}</h1>
                <div class="text-xs md:text-sm text-slate-300 border-t border-slate-700 pt-3 flex flex-wrap gap-x-4 gap-y-1">
                    <span class="font-medium">{{설교자}}</span>
                    <span class="text-slate-500">|</span>
                    <span>{{본문 예: 이사야 1:1-20}}</span>
                    <span class="text-slate-500">|</span>
                    <span>{{날짜와 예배명 예: 2026년 7월 16일 새벽기도회}}</span>
                </div>
                <!-- 핵심 주제 박스 -->
                <div class="mt-6 bg-slate-800/80 border border-slate-700 rounded-xl p-4 text-sm md:text-base text-slate-200">
                    <span class="text-indigo-400 font-bold block mb-1">핵심 주제</span>
                    {{설교 전체를 한 문단으로 압축한 핵심 주제}}
                </div>
            </div>
        </header>
        <!-- 2단계: 성경 본문 배치 -->
        <section class="bg-white rounded-2xl shadow-md p-6 mb-6">
            <h2 class="text-lg font-bold text-slate-800 mb-4 flex items-center space-x-2">
                <svg class="w-5 h-5 text-indigo-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 4H6a2 2 0 00-2 2v12a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-2m-4-1v8m0 0l3-3m-3 3L9 8m-5 5h2.586a1 1 0 01.707.293l2.414 2.414a1 1 0 00.707.293h3.172a1 1 0 00.707-.293l2.414-2.414a1 1 0 01.707-.293H20"></path>
                </svg>
                <span>오늘의 성경 본문 ({{본문}})</span>
            </h2>
            <div class="scripture-text-section max-h-60 overflow-y-auto border border-gray-200 rounded-xl p-4 bg-gray-50 text-sm text-gray-700 shadow-inner">
                <!-- 본문 각 절을 <p><strong>절번호</strong> 본문내용</p> 형식으로 나열 -->
                <p><strong>1</strong> {{1절 본문}}</p>
                <p><strong>2</strong> {{2절 본문}}</p>
            </div>
        </section>
        <!-- 핵심 내용 인포그래픽 카드 -->
        <div class="space-y-6">
            <!--
              카드 색상 규칙 (border-t-4 / 아이콘 배경 / 아이콘 색):
                1) 역사·배경  : orange-500 / bg-orange-100 / text-orange-600 / text-orange-800
                2) 원리·본질  : purple-600 / bg-purple-100 / text-purple-600 / text-purple-800
                3) 경고·배격  : rose-600   / bg-rose-100   / text-rose-600   / text-rose-800
                4) 목록·규례  : blue-600   / bg-blue-100   / text-blue-600   / text-blue-800
                5) 적용·목적  : emerald-600/ bg-emerald-100/ text-emerald-600/ text-emerald-800
                6) 결론·책임  : gray-600   / bg-gray-100   / text-gray-600   / text-gray-800
              각 카드 = 아이콘 + 굵은 h3 소제목 + 본문 단락들.
              강조는 <span class="keyword">...</span>, 인용은 <blockquote class="border-l-4 ...">.
              설교 내용에 맞게 카드 개수(보통 4~6개)와 소제목을 자유롭게 구성.
            -->
            <div class="card bg-white rounded-lg shadow-lg p-6 border-t-4 border-orange-500 text-orange-800">
                <div class="flex items-center space-x-3 mb-4">
                    <div class="p-2 bg-orange-100 rounded-lg">
                        <svg class="w-6 h-6 text-orange-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"></path>
                        </svg>
                    </div>
                    <h3 class="text-lg font-bold">{{카드 소제목}}</h3>
                </div>
                <div class="text-gray-700 text-sm md:text-base space-y-3">
                    <p>{{본문 단락. 핵심은 }}<span class="keyword">형광펜 강조</span></p>
                    <ul class="list-disc pl-5 space-y-2 text-gray-600">
                        <li><span class="font-semibold text-gray-800">{{리드}}</span>: {{설명}}</li>
                    </ul>
                </div>
            </div>
            <!-- 카드 2~6 반복 -->
        </div>
        <!-- 푸터 -->
        <footer class="mt-12 text-center text-xs text-gray-500 border-t border-gray-200 pt-6">
            <p>© {{연도}} {{교회명}} - {{예배/코너명}}</p>
            <p class="mt-1">개혁주의 언약신학 관점의 설교 분석 및 학습 지도</p>
        </footer>
    </div>
    <!-- 외부 연동: 유튜브 링크(필수) + script.js -->
    <input type="hidden" id="youtube-link" value="{{유튜브 링크}}">
    <script src="script.js"></script>
</body>
</html>
